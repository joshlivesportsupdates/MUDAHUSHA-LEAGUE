name: probe-browser
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install seleniumbase
      - run: |
          cat > probe.py <<'EOF'
          from seleniumbase import SB
          url = "https://www.forebet.com/en/football/matches/sabah-slavia-praha-2547548"
          with SB(uc=True, headless=False, xvfb=True) as sb:
              sb.uc_open_with_reconnect(url, 8)
              print("TITLE:", sb.get_title())
              print("HTML length:", len(sb.get_page_source()))
              print("has st_res:", sb.is_element_present("span.st_res"))
          EOF
          python probe.py
